<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d">
<title id="t">Attention Is All You Need — modern conference research poster</title>
<desc id="d">A visual overview of Vaswani et al. 2017 Transformer with sequence parallelism, scaled dot-product attention, encoder-decoder architecture, WMT14 BLEU results and model limitations.</desc>
<defs><style>text{font-family:Arial,"Helvetica Neue",sans-serif}.white{fill:#fff}.ink{fill:#173044}.muted{fill:#627783}.t{font-weight:800}.caps{letter-spacing:2px}.card{fill:#fff;stroke:#d7e2e1;stroke-width:2}.tiny{font-size:18px}.body{font-size:23px}.section{font-size:27px;font-weight:bold}</style></defs>
<rect width="1600" height="1200" fill="#f6f8f7"/>
<rect width="1600" height="255" fill="#112b3c"/><rect y="252" width="1600" height="5" fill="#0f968e"/>
<rect x="44" y="33" width="6" height="188" fill="#ff815c"/>
<text x="70" y="56" font-size="19" fill="#aed0d2" class="t caps">RESEARCH POSTER  /  FOUNDATIONAL MACHINE LEARNING  /  2017</text>
<text x="67" y="129" font-size="74" class="white t">ATTENTION IS</text><text x="67" y="200" font-size="74" class="white t">ALL YOU NEED</text>
<text x="70" y="232" font-size="17" fill="#cfe1e4">Vaswani · Shazeer · Parmar · Uszkoreit · Jones · Gomez · Kaiser · Polosukhin  /  NeurIPS 2017</text>
<rect x="1120" y="38" rx="9" width="430" height="182" fill="#20485c" stroke="#4c7b86" stroke-width="2"/>
<text x="1142" y="78" font-size="16" class="caps" fill="#88d4c8">THE CENTRAL IDEA</text>
<text x="1142" y="117" font-size="33" class="t white">NO RECURRENCE.</text><text x="1142" y="156" font-size="33" class="t" fill="#62deca">ALL ATTENTION.</text>
<text x="1142" y="188" font-size="19" fill="#d2e8e8">Model global token interactions directly.</text>
<!-- Left / motivation -->
<rect x="39" y="290" width="7" height="35" fill="#0f968e"/><text x="59" y="316" class="section ink">01 / WHY ATTENTION?</text>
<text x="42" y="361" font-size="23" class="ink t">Recurrence serializes computation.</text>
<rect x="39" y="385" width="380" height="138" rx="10" class="card"/><text x="60" y="411" class="tiny muted t">RECURRENT / SEQUENTIAL</text>
<g fill="#feeee7" stroke="#e6aa95" stroke-width="2"><rect x="61" y="437" width="63" height="57" rx="7"/><rect x="131" y="437" width="63" height="57" rx="7"/><rect x="201" y="437" width="63" height="57" rx="7"/><rect x="271" y="437" width="63" height="57" rx="7"/><rect x="341" y="437" width="58" height="57" rx="7"/></g>
<text x="79" y="472" font-size="22" fill="#bb654a">t₁ → t₂ → t₃ → t₄ → t₅</text><text x="61" y="514" font-size="17" fill="#a96e56">Sequence depth grows with n.</text>
<rect x="39" y="540" width="380" height="171" rx="10" class="card"/><text x="60" y="566" class="tiny t" fill="#078c80">SELF-ATTENTION / PARALLEL</text>
<g stroke="#afd7d3" stroke-width="2"><path d="M80 610L360 674M150 610L290 674M220 610L80 674M360 610L150 674M80 610L220 674M360 610L290 674"/></g>
<g fill="#0f968e"><circle cx="80" cy="605" r="21"/><circle cx="150" cy="605" r="21"/><circle cx="220" cy="605" r="21"/><circle cx="290" cy="605" r="21"/><circle cx="360" cy="605" r="21"/></g>
<g fill="#e2f5f0"><rect x="59" y="671" width="42" height="30" rx="5"/><rect x="129" y="671" width="42" height="30" rx="5"/><rect x="199" y="671" width="42" height="30" rx="5"/><rect x="269" y="671" width="42" height="30" rx="5"/><rect x="339" y="671" width="42" height="30" rx="5"/></g>
<text x="39" y="754" class="section ink">02 / THE OPERATION</text>
<rect x="39" y="776" width="380" height="171" rx="10" fill="#112b3c"/>
<text x="61" y="818" font-size="21" fill="#b4d1d6">Scaled dot-product attention</text>
<text x="53" y="877" font-size="29" class="white t">softmax(QKᵀ/√dₖ) V</text>
<text x="60" y="916" font-size="21" fill="#b9d9d9">Q: queries  ·  K: keys  ·  V: values</text>
<text x="39" y="992" class="section ink">03 / MULTI-HEAD</text><text x="40" y="1031" font-size="21" class="muted">Different projections learn</text><text x="40" y="1060" font-size="21" class="muted">complementary relationships.</text>
<g fill="#e7f1f6"><rect x="43" y="1080" width="83" height="46" rx="6"/><rect x="135" y="1080" width="83" height="46" rx="6"/><rect x="227" y="1080" width="83" height="46" rx="6"/><rect x="319" y="1080" width="83" height="46" rx="6"/></g>

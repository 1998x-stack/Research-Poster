<rect x="1170" y="777" width="391" height="176" rx="10" class="card"/>
<text x="1190" y="814" font-size="22" class="ink t">6+6 layers  ·  8 heads</text><text x="1190" y="857" font-size="22" class="ink t">d_model = 512</text><text x="1190" y="900" font-size="22" class="ink t">d_ff = 2048  ·  ≈65M params</text>

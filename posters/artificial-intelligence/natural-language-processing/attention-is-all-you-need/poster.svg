<text x="1190" y="377" font-size="21" class="muted t">WMT14 · EN → DE</text><text x="1189" y="452" font-size="76" class="t" fill="#2c6282">28.4</text><text x="1397" y="452" font-size="25" class="ink t">BLEU</text><text x="1190" y="486" font-size="19" class="muted">Transformer (big) · proceedings</text>

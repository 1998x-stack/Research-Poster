<text x="1190" y="1051" font-size="20" fill="#a25b45" class="t">Dense attention scales</text><text x="1190" y="1082" font-size="20" fill="#a25b45" class="t">quadratically in sequence length.</text><text x="1190" y="1112" font-size="17" fill="#775e55">Decoder still autoregressive.</text>

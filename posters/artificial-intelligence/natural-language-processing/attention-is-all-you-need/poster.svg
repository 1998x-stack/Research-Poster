<g fill="none" stroke="#0f968e" stroke-width="4"><path d="M960 930V850V755"/><path d="M960 681V664"/><path d="M960 596V580"/><path d="M960 513V484"/><path d="M738 492H791V624H836"/></g>
<rect x="504" y="745" width="234" height="51" rx="8" fill="#fff1d2"/><text x="519" y="777" font-size="21" fill="#7d641d">+ Positional encoding</text>
<rect x="833" y="786" width="259" height="51" rx="8" fill="#fff1d2"/><text x="854" y="818" font-size="21" fill="#7d641d">+ Positional encoding</text>
<g fill="#fff" stroke="#bbcdd5" stroke-width="2"><rect x="522" y="848" width="195" height="55" rx="8"/><rect x="522" y="936" width="195" height="55" rx="8"/><rect x="854" y="860" width="212" height="55" rx="8"/><rect x="854" y="948" width="212" height="55" rx="8"/></g>
<g font-size="19" class="ink t"><text x="537" y="883">Input embeddings</text><text x="549" y="971">Source tokens</text><text x="869" y="895">Output embeddings</text><text x="858" y="983">Shifted target tokens</text></g>
<rect x="467" y="1021" width="657" height="40" rx="8" fill="#112b3c"/><text x="482" y="1047" font-size="19" class="white t">Residual connections + LayerNorm around sublayers</text>

<text x="861" y="553" font-size="20" class="ink t">Feed-forward network</text><text x="851" y="637" font-size="19" class="ink t">Encoder–decoder attn.</text><text x="856" y="719" font-size="20" class="ink t">Masked self-attn.</text>

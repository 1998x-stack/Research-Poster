name: Publish Research Poster gallery
on:
  push:
    branches: [main]
    paths:
      - "posters/**"
      - "catalog/**"
      - "scripts/**"
      - "site/**"
      - "requirements-render.txt"
      - ".agents/skills/research-poster/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-poster-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poster rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils
          python -m pip install -r requirements-render.txt
      - name: Build editable PPTX, print PDF and preview PNG
        run: python scripts/render_posters.py
      - name: Version generated poster files in the repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find posters -type f \( -name "poster.pptx" -o -name "poster.pdf" -o -name "preview.png" \) -print0 | xargs -0 -r git add --
          if ! git diff --cached --quiet; then
            git commit -m "build: archive reproducible poster assets [skip ci]"
            git push origin HEAD:main
          fi
      - name: Verify source and rendered assets
        run: python scripts/validate_catalog.py --strict-assets
      - name: Preflight all published posters
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          for metadata in Path("posters").glob("*/*/*/poster.json"):
              if json.loads(metadata.read_text())["status"] == "published":
                  subprocess.run([sys.executable,
                      ".agents/skills/research-poster/scripts/preflight.py",
                      str(metadata.parent), "--strict"], check=True)
          PY
      - name: Build the GitHub Pages gallery
        run: python scripts/build_site.py --output _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://1998x-stack.github.io/Research-Poster/
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4

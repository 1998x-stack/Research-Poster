<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Results-led research poster wireframe</title>
<desc id="desc">A results-oriented research poster layout centered on a large empirical chart with supporting protocol, baselines, context and limitations.</desc>
<rect width="1200" height="900" fill="#f6f8f7"/>
<rect width="1200" height="170" fill="#112b3c"/>
<g font-family="Arial,sans-serif"><text x="54" y="59" font-size="18" fill="#9adad1">RESEARCH POSTER  /  RESULTS-LED WIREFRAME</text><text x="54" y="116" font-size="44" fill="white" font-weight="700">PAPER TITLE / VERIFIED RESULT</text><text x="54" y="149" font-size="20" fill="#d5e4e6">Authors · Venue · Year · Source</text></g>
<rect x="35" y="190" width="1130" height="120" rx="16" fill="#e0f2ed"/>
<text x="60" y="236" fill="#106d69" font-family="Arial,sans-serif" font-size="19">ONE DEFENSIBLE TAKEAWAY</text>
<text x="60" y="275" fill="#112b3c" font-family="Arial,sans-serif" font-weight="700" font-size="30">Numerical claims must cite protocol and source</text>
<rect x="35" y="330" width="750" height="450" rx="16" fill="white" stroke="#74b9af" stroke-width="3"/>
<rect x="804" y="330" width="361" height="212" rx="16" fill="white" stroke="#d8e3e5" stroke-width="2"/>
<rect x="804" y="558" width="361" height="222" rx="16" fill="white" stroke="#d8e3e5" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#112b3c" font-size="24" font-weight="700"><text x="58" y="374">Main experiment / trade-off plot</text><text x="827" y="375">Protocol / method</text><text x="827" y="600">Baselines / caveats</text></g>
<g stroke="#b1c5ca" stroke-width="3"><path d="M105 431V691H712"/><path d="M105 524H712M105 610H712" stroke-dasharray="8 8" opacity=".5"/></g>
<text x="140" y="733" fill="#55737a" font-family="Arial,sans-serif" font-size="19">Replace with sourced chart; show axes, units, baselines, uncertainty</text>
<rect x="35" y="800" width="1130" height="77" rx="12" fill="#e9eff0"/>
<text x="58" y="833" fill="#112b3c" font-family="Arial,sans-serif" font-size="21" font-weight="700">Failure cases, validity threats and attribution</text>
<text x="58" y="860" fill="#5b737c" font-family="Arial,sans-serif" font-size="17">Use comparable conditions. Never invent error bars or truncate scales silently.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Hybrid research poster wireframe</title>
<desc id="desc">Editable generic layout: research title, key finding, left context, dominant central mechanism, right evidence, bottom limitations and citation.</desc>
<rect width="1200" height="900" fill="#f6f8f7"/>
<rect width="1200" height="170" fill="#112b3c"/>
<text x="52" y="61" fill="#a7ded8" font-family="Arial,sans-serif" font-size="18">RESEARCH POSTER  /  MECHANISM-LED WIREFRAME</text>
<text x="52" y="116" fill="#fff" font-family="Arial,sans-serif" font-size="47" font-weight="700">PAPER TITLE / MAIN CONTRIBUTION</text>
<text x="52" y="148" fill="#d1e5e6" font-family="Arial,sans-serif" font-size="20">Authors · Venue · Year · Source</text>
<rect x="35" y="191" width="1130" height="100" rx="16" fill="#e0f2ed"/>
<text x="58" y="230" fill="#116b69" font-family="Arial,sans-serif" font-size="18">TAKEAWAY</text>
<text x="58" y="264" fill="#112b3c" font-family="Arial,sans-serif" font-size="28" font-weight="700">One verified finding, readable in eight seconds</text>
<rect x="35" y="311" width="274" height="477" rx="16" fill="white" stroke="#d6e1e4" stroke-width="2"/>
<rect x="325" y="311" width="533" height="477" rx="16" fill="white" stroke="#74b9af" stroke-width="3"/>
<rect x="874" y="311" width="291" height="477" rx="16" fill="white" stroke="#d6e1e4" stroke-width="2"/>
<g fill="#112b3c" font-family="Arial,sans-serif" font-weight="700" font-size="25"><text x="58" y="355">Context / problem</text><text x="349" y="355">Method / mechanism</text><text x="898" y="355">Evidence / results</text></g>
<g fill="#698088" font-family="Arial,sans-serif" font-size="20"><text x="58" y="401">Research question</text><text x="58" y="442">Prior bottleneck</text><text x="58" y="483">Constraints</text><text x="349" y="417">Editable vector diagram goes here</text><text x="349" y="463">Label arrows, stages and assumptions</text><text x="898" y="401">Baseline + units</text><text x="898" y="442">Protocol + variant</text><text x="898" y="483">Uncertainty / error</text></g>
<rect x="35" y="809" width="1130" height="68" rx="12" fill="#e9eff0"/>
<text x="58" y="838" fill="#112b3c" font-family="Arial,sans-serif" font-size="20" font-weight="700">Limitations / provenance</text>
<text x="58" y="861" fill="#5d737d" font-family="Arial,sans-serif" font-size="17">Failure cases · version-specific citation · QR to official paper</text>
</svg>
